name: cafe_spot
description: CT484 CafeSpot - Ung dung review quan ca phe (nhom Thong & Vuong)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.1
  provider: ^6.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.4.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#6F4E37"
  adaptive_icon_foreground: assets/images/app_icon.png

flutter_native_splash:
  color: "#6F4E37"
  image: assets/images/splash_logo.png
  android: true
  ios: true
